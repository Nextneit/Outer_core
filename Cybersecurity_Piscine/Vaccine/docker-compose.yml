# =============================================================================
# docker-compose.yml — DVWA test environment
#
# Spins up:
#   1. dvwa_target  -> DVWA (Damn Vulnerable Web Application) on port 8080
#                     Legal, local SQL injection test target.
#   2. sqlite_lab   -> Local Flask+SQLite vulnerable lab on port 5001
#                     Built from Dockerfile in this directory.
#
# Usage:
#   docker compose up -d
#   python3 vaccine.py "http://localhost:8080/vulnerabilities/sqli/?id=1&Submit=Submit"
#
# DVWA first-run setup (browser):
#   1. Open http://localhost:8080
#   2. Login: admin / password
#   3. Go to "DVWA Security" -> set to "Low"
#   4. Go to "Setup / Reset DB" -> click "Create / Reset Database"
#   5. Login again with admin / password
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # DVWA — Damn Vulnerable Web Application
  # A deliberately insecure PHP/MySQL application for legal testing.
  # Image: https://hub.docker.com/r/vulnerables/web-dvwa
  # ---------------------------------------------------------------------------
  dvwa_target:
    image: vulnerables/web-dvwa
    container_name: dvwa_target
    ports:
      - "8080:80"          # http://localhost:8080 from the host browser
    environment:
      MYSQL_ROOT_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: dvwa
    networks:
      - vaccine_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/login.php"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # sqlite_lab
  # Simple Flask app intentionally vulnerable to SQLite injection.
  # Built from local Dockerfile + app.py.
  # ---------------------------------------------------------------------------
  sqlite_lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sqlite_lab
    ports:
      - "5001:5000"       # http://localhost:5001
    networks:
      - vaccine_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

# =============================================================================
# Networks
# =============================================================================
networks:
  vaccine_net:
    driver: bridge
    name: vaccine_net
