services:
  ftp-server:
    image: fauria/vsftpd
    container_name: ftp-server
    environment:
      - FTP_USER=user
      - FTP_PASS=password
      - PASV_ADDRESS=172.20.0.2
      - WRITE_ENABLE=YES
      - PASV_MIN_PORT=21100
      - PASV_MAX_PORT=21110
    networks:
      inquisitor_net:
        ipv4_address: 172.20.0.2

  ftp-client:
    image: debian:bookworm-slim
    container_name: ftp-client
    command: sleep infinity
    networks:
      inquisitor_net:
        ipv4_address: 172.20.0.3

  attacker:
    build: .
    container_name: attacker
    networks:
      inquisitor_net:
        ipv4_address: 172.20.0.4
    cap_add:
      - NET_RAW
      - NET_ADMIN
    command: sleep infinity

networks:
  inquisitor_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
